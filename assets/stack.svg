<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" role="img" aria-labelledby="stackTitle stackDesc">
  <title id="stackTitle">PressFolio project structure and stack</title>
  <desc id="stackDesc">The repository is organised into src pages for routes, src layouts for shared shells, src components for header, footer and content sections, src styles for the stylesheet, and scripts for brand asset generation. Supporting files are astro config, vercel config, src config and src schema.</desc>

  <rect width="880" height="300" fill="#FFFFFF"/>

  <!-- Tree -->
  <rect x="24" y="28" width="430" height="248" rx="11" fill="#1A1A1A"/>
  <text x="46" y="56" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1.3" fill="#9A9A9A">PROJECT STRUCTURE</text>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12">
    <text x="46" y="84" fill="#FAFAFA">pressfolio/</text>

    <text x="46" y="108" fill="#9A9A9A">&#9500;&#9472; src/</text>
    <text x="70" y="130" fill="#9A9A9A">&#9500;&#9472; pages/</text>
    <text x="94" y="150" fill="#FAFAFA">index.astro</text>
    <text x="248" y="150" fill="#7A7A7A"># the tool</text>
    <text x="94" y="168" fill="#FAFAFA">blog/</text>
    <text x="248" y="168" fill="#7A7A7A"># 3 guides + index</text>
    <text x="94" y="186" fill="#FAFAFA">api/generate.ts</text>
    <text x="248" y="186" fill="#EF4444"># AI route</text>
    <text x="94" y="204" fill="#FAFAFA">sitemap.xml.ts</text>
    <text x="248" y="204" fill="#7A7A7A"># generated sitemap</text>

    <text x="70" y="228" fill="#9A9A9A">&#9500;&#9472; layouts/</text>
    <text x="94" y="246" fill="#FAFAFA">BaseLayout &#183; GuideLayout</text>
    <text x="70" y="264" fill="#9A9A9A">&#9492;&#9472; components/ &#183; config.ts</text>
  </g>

  <!-- Stack cards -->
  <text x="480" y="56" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1.3" fill="#7A7A7A">STACK</text>

  <rect x="480" y="72" width="176" height="70" rx="9" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="500" y="98" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#1A1A1A">Astro 4</text>
  <text x="500" y="120" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#7A7A7A">output: server</text>

  <rect x="668" y="72" width="188" height="70" rx="9" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="688" y="98" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#1A1A1A">Vercel adapter</text>
  <text x="688" y="120" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#7A7A7A">serverless functions</text>

  <rect x="480" y="154" width="176" height="70" rx="9" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="500" y="180" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#1A1A1A">NaraRouter</text>
  <text x="500" y="202" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#7A7A7A">AI backend</text>

  <rect x="668" y="154" width="188" height="70" rx="9" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="688" y="180" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#1A1A1A">Vanilla CSS</text>
  <text x="688" y="202" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#7A7A7A">custom properties</text>

  <rect x="480" y="236" width="376" height="40" rx="9" fill="#F5F5F0" stroke="#D8D8D0" stroke-width="1.5"/>
  <text x="500" y="261" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#4A4A4A">No database, no accounts. Drafts live in localStorage.</text>
</svg>
