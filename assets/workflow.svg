<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Five stage workflow: Input, Parse, Refine, Compose, Export">
  <defs>
    <style>
      .ink { fill: #1A1A1A; }
      .red { fill: #D62828; }
      .card { fill: #FFFFFF; stroke: #1A1A1A; stroke-width: 3; }
      .shadow { fill: #1A1A1A; }
      .soft { fill: #F5F5F0; }
      .sans { font-family: 'Inter', -apple-system, 'Segoe UI', Roboto, sans-serif; }
      .mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; }
      .serif { font-family: 'Playfair Display', Georgia, serif; }
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="300" fill="#FAFAF8"/>
  <text class="serif" x="40" y="52" font-size="30" font-weight="700" fill="#1A1A1A">The 5-Stage Workflow</text>
  <rect class="red" x="326" y="34" width="52" height="6"/>

  <!-- stage cards: x = 40, 272.5, 505, 737.5, 970 ; width 190 -->
  <g>
    <!-- 1 INPUT -->
    <rect class="shadow" x="46" y="102" width="180" height="150" rx="10"/>
    <rect class="card" x="40" y="96" width="180" height="150" rx="10"/>
    <circle cx="70" cy="126" r="16" fill="#D62828"/>
    <text class="sans" x="70" y="132" font-size="17" font-weight="700" text-anchor="middle" fill="#FFFFFF">1</text>
    <rect class="soft" x="100" y="116" width="90" height="9" rx="3"/>
    <rect class="soft" x="100" y="134" width="60" height="9" rx="3"/>
    <text class="sans" x="60" y="190" font-size="19" font-weight="700" fill="#1A1A1A">Input</text>
    <text class="mono" x="60" y="214" font-size="12" fill="#7A7A7A">Paste release</text>

    <!-- 2 PARSE -->
    <rect class="shadow" x="278.5" y="102" width="180" height="150" rx="10"/>
    <rect class="card" x="272.5" y="96" width="180" height="150" rx="10"/>
    <circle cx="302.5" cy="126" r="16" fill="#D62828"/>
    <text class="sans" x="302.5" y="132" font-size="17" font-weight="700" text-anchor="middle" fill="#FFFFFF">2</text>
    <rect class="soft" x="332.5" y="116" width="90" height="9" rx="3"/>
    <rect class="soft" x="332.5" y="134" width="70" height="9" rx="3"/>
    <text class="sans" x="292.5" y="190" font-size="19" font-weight="700" fill="#1A1A1A">Parse</text>
    <text class="mono" x="292.5" y="214" font-size="12" fill="#7A7A7A">Extract facts</text>

    <!-- 3 REFINE -->
    <rect class="shadow" x="511" y="102" width="180" height="150" rx="10"/>
    <rect class="card" x="505" y="96" width="180" height="150" rx="10"/>
    <circle cx="535" cy="126" r="16" fill="#D62828"/>
    <text class="sans" x="535" y="132" font-size="17" font-weight="700" text-anchor="middle" fill="#FFFFFF">3</text>
    <rect class="soft" x="565" y="116" width="90" height="9" rx="3"/>
    <rect class="soft" x="565" y="134" width="55" height="9" rx="3"/>
    <text class="sans" x="525" y="190" font-size="19" font-weight="700" fill="#1A1A1A">Refine</text>
    <text class="mono" x="525" y="214" font-size="12" fill="#7A7A7A">Edit / AI mode</text>

    <!-- 4 COMPOSE -->
    <rect class="shadow" x="743.5" y="102" width="180" height="150" rx="10"/>
    <rect class="card" x="737.5" y="96" width="180" height="150" rx="10"/>
    <circle cx="767.5" cy="126" r="16" fill="#D62828"/>
    <text class="sans" x="767.5" y="132" font-size="17" font-weight="700" text-anchor="middle" fill="#FFFFFF">4</text>
    <rect class="soft" x="797.5" y="116" width="90" height="9" rx="3"/>
    <rect class="soft" x="797.5" y="134" width="65" height="9" rx="3"/>
    <text class="sans" x="757.5" y="190" font-size="19" font-weight="700" fill="#1A1A1A">Compose</text>
    <text class="mono" x="757.5" y="214" font-size="12" fill="#7A7A7A">Live preview</text>

    <!-- 5 EXPORT -->
    <rect class="shadow" x="976" y="102" width="180" height="150" rx="10"/>
    <rect class="card" x="970" y="96" width="180" height="150" rx="10"/>
    <circle cx="1000" cy="126" r="16" fill="#D62828"/>
    <text class="sans" x="1000" y="132" font-size="17" font-weight="700" text-anchor="middle" fill="#FFFFFF">5</text>
    <rect class="soft" x="1030" y="116" width="90" height="9" rx="3"/>
    <rect class="soft" x="1030" y="134" width="50" height="9" rx="3"/>
    <text class="sans" x="990" y="190" font-size="19" font-weight="700" fill="#1A1A1A">Export</text>
    <text class="mono" x="990" y="214" font-size="12" fill="#7A7A7A">MD / HTML</text>
  </g>

  <!-- arrows between cards -->
  <g stroke="#D62828" stroke-width="6" stroke-linecap="round" fill="none">
    <line x1="224" y1="171" x2="258" y2="171"/><polygon points="258,159 276,171 258,183" fill="#D62828" stroke="none"/>
    <line x1="456.5" y1="171" x2="490.5" y2="171"/><polygon points="490.5,159 508.5,171 490.5,183" fill="#D62828" stroke="none"/>
    <line x1="689" y1="171" x2="723" y2="171"/><polygon points="723,159 741,171 723,183" fill="#D62828" stroke="none"/>
    <line x1="921.5" y1="171" x2="955.5" y2="171"/><polygon points="955.5,159 973.5,171 955.5,183" fill="#D62828" stroke="none"/>
  </g>
</svg>
