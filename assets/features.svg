<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-label="Core features grid">
  <defs>
    <style>
      .ink { fill: #1A1A1A; }
      .red { fill: #D62828; }
      .card { fill: #FFFFFF; stroke: #1A1A1A; stroke-width: 3; }
      .shadow { fill: #1A1A1A; }
      .soft { fill: #F5F5F0; }
      .sans { font-family: 'Inter', -apple-system, 'Segoe UI', Roboto, sans-serif; }
      .mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; }
      .serif { font-family: 'Playfair Display', Georgia, serif; }
    </style>
  </defs>
  <rect x="0" y="0" width="1200" height="560" fill="#FAFAF8"/>
  <text class="serif" x="40" y="52" font-size="30" font-weight="700" fill="#1A1A1A">Core Features</text>
  <rect class="red" x="258" y="34" width="52" height="6"/>

  <!-- 6 cards: 3 columns x 2 rows -->
  <!-- col x: shadow+6 ; card x = 40, 420, 800 ; width 340 ; row y card = 90, 330 ; height 200 -->

  <!-- Card 1 Smart Input -->
  <rect class="shadow" x="46" y="96" width="340" height="200" rx="10"/>
  <rect class="card" x="40" y="90" width="340" height="200" rx="10"/>
  <rect x="64" y="114" width="56" height="56" rx="8" fill="#FEE2E2"/>
  <path d="M84 132 h16 M84 144 h16 M84 156 h10" stroke="#D62828" stroke-width="4" stroke-linecap="round"/>
  <text class="sans" x="136" y="140" font-size="20" font-weight="700" fill="#1A1A1A">Smart Input</text>
  <text class="sans" x="64" y="200" font-size="15" fill="#4A4A4A">Paste any press release -</text>
  <text class="sans" x="64" y="224" font-size="15" fill="#4A4A4A">PIB, company PRs,</text>
  <text class="sans" x="64" y="248" font-size="15" fill="#4A4A4A">ministerial statements.</text>

  <!-- Card 2 Auto-Parse -->
  <rect class="shadow" x="426" y="96" width="340" height="200" rx="10"/>
  <rect class="card" x="420" y="90" width="340" height="200" rx="10"/>
  <rect x="444" y="114" width="56" height="56" rx="8" fill="#FEE2E2"/>
  <circle cx="472" cy="142" r="14" stroke="#D62828" stroke-width="4" fill="none"/>
  <line x1="482" y1="152" x2="494" y2="164" stroke="#D62828" stroke-width="4" stroke-linecap="round"/>
  <text class="sans" x="516" y="140" font-size="20" font-weight="700" fill="#1A1A1A">Auto-Parse</text>
  <text class="sans" x="444" y="200" font-size="15" fill="#4A4A4A">Extracts Source, Date,</text>
  <text class="sans" x="444" y="224" font-size="15" fill="#4A4A4A">Quote, Figures and</text>
  <text class="sans" x="444" y="248" font-size="15" fill="#4A4A4A">Context automatically.</text>

  <!-- Card 3 AI Enhancement -->
  <rect class="shadow" x="806" y="96" width="340" height="200" rx="10"/>
  <rect class="card" x="800" y="90" width="340" height="200" rx="10"/>
  <rect x="824" y="114" width="56" height="56" rx="8" fill="#FEE2E2"/>
  <path d="M852 122 l7 18 l18 7 l-18 7 l-7 18 l-7 -18 l-18 -7 l18 -7 z" fill="#D62828"/>
  <text class="sans" x="896" y="140" font-size="20" font-weight="700" fill="#1A1A1A">AI Enhancement</text>
  <text class="sans" x="824" y="200" font-size="15" fill="#4A4A4A">Optional AI mode writes</text>
  <text class="sans" x="824" y="224" font-size="15" fill="#4A4A4A">detailed, engaging posts</text>
  <text class="sans" x="824" y="248" font-size="15" fill="#4A4A4A">with a free API key.</text>

  <!-- Card 4 Multiple Formats -->
  <rect class="shadow" x="46" y="336" width="340" height="200" rx="10"/>
  <rect class="card" x="40" y="330" width="340" height="200" rx="10"/>
  <rect x="64" y="354" width="56" height="56" rx="8" fill="#FEE2E2"/>
  <rect x="76" y="366" width="18" height="24" rx="2" fill="#D62828"/>
  <rect x="98" y="372" width="12" height="18" rx="2" fill="#1A1A1A"/>
  <text class="sans" x="136" y="380" font-size="20" font-weight="700" fill="#1A1A1A">Multiple Formats</text>
  <text class="sans" x="64" y="440" font-size="15" fill="#4A4A4A">News Article, Quick Brief</text>
  <text class="sans" x="64" y="464" font-size="15" fill="#4A4A4A">or Tweet Thread - pick</text>
  <text class="sans" x="64" y="488" font-size="15" fill="#4A4A4A">the shape you need.</text>

  <!-- Card 5 Export -->
  <rect class="shadow" x="426" y="336" width="340" height="200" rx="10"/>
  <rect class="card" x="420" y="330" width="340" height="200" rx="10"/>
  <rect x="444" y="354" width="56" height="56" rx="8" fill="#FEE2E2"/>
  <path d="M472 364 v20 m-8 -8 l8 8 l8 -8" stroke="#D62828" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="458" y1="398" x2="486" y2="398" stroke="#D62828" stroke-width="4" stroke-linecap="round"/>
  <text class="sans" x="516" y="380" font-size="20" font-weight="700" fill="#1A1A1A">Export</text>
  <text class="sans" x="444" y="440" font-size="15" fill="#4A4A4A">Copy Markdown, copy HTML</text>
  <text class="sans" x="444" y="464" font-size="15" fill="#4A4A4A">or download a .md file -</text>
  <text class="sans" x="444" y="488" font-size="15" fill="#4A4A4A">all in one click.</text>

  <!-- Card 6 Private by Default -->
  <rect class="shadow" x="806" y="336" width="340" height="200" rx="10"/>
  <rect class="card" x="800" y="330" width="340" height="200" rx="10"/>
  <rect x="824" y="354" width="56" height="56" rx="8" fill="#FEE2E2"/>
  <path d="M840 382 v-8 a12 12 0 0 1 24 0 v8" stroke="#D62828" stroke-width="4" fill="none"/>
  <rect x="836" y="382" width="32" height="24" rx="4" fill="#D62828"/>
  <text class="sans" x="896" y="380" font-size="20" font-weight="700" fill="#1A1A1A">Private by Default</text>
  <text class="sans" x="824" y="440" font-size="15" fill="#4A4A4A">Basic mode runs fully in</text>
  <text class="sans" x="824" y="464" font-size="15" fill="#4A4A4A">your browser. Text is never</text>
  <text class="sans" x="824" y="488" font-size="15" fill="#4A4A4A">uploaded in that mode.</text>
</svg>
