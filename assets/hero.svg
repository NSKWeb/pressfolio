<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">PressFolio — press release to blog post converter</title>
  <desc id="heroDesc">A press release document on the left is converted into a publish-ready blog post on the right. Caption: turn any press release into a publish-ready blog post. Badges: 100 percent free, no signup, Markdown and HTML, AI optional.</desc>

  <rect width="880" height="300" fill="#FAFAF8"/>
  <rect width="880" height="7" fill="#D62828"/>

  <text x="40" y="122" font-family="Georgia,'Times New Roman',serif" font-size="54" font-weight="700" fill="#1A1A1A">Press<tspan fill="#D62828">Folio</tspan></text>
  <text x="40" y="162" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" fill="#4A4A4A">Turn any press release into a</text>
  <text x="40" y="186" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" fill="#4A4A4A">publish-ready blog post.</text>

  <g font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#1A1A1A">
    <rect x="40" y="216" width="98" height="34" rx="17" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.5"/>
    <text x="89" y="238" text-anchor="middle">100% free</text>

    <rect x="150" y="216" width="98" height="34" rx="17" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.5"/>
    <text x="199" y="238" text-anchor="middle">No signup</text>

    <rect x="260" y="216" width="140" height="34" rx="17" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.5"/>
    <text x="330" y="238" text-anchor="middle">Markdown + HTML</text>

    <rect x="412" y="216" width="112" height="34" rx="17" fill="#FEE2E2" stroke="#D62828" stroke-width="1.5"/>
    <text x="468" y="238" text-anchor="middle" fill="#B91C1C">AI optional</text>
  </g>

  <!-- Source document -->
  <g>
    <rect x="546" y="42" width="146" height="216" rx="9" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.5"/>
    <text x="619" y="66" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.4" fill="#7A7A7A">PRESS RELEASE</text>
    <line x1="560" y1="78" x2="678" y2="78" stroke="#E5E5DF" stroke-width="1.5"/>

    <rect x="560" y="90" width="118" height="10" rx="5" fill="#1A1A1A"/>
    <rect x="560" y="110" width="106" height="7" rx="3.5" fill="#D8D8D0"/>
    <rect x="560" y="124" width="118" height="7" rx="3.5" fill="#D8D8D0"/>
    <rect x="560" y="138" width="92" height="7" rx="3.5" fill="#D8D8D0"/>

    <rect x="556" y="156" width="126" height="46" rx="6" fill="#FEE2E2" stroke="#D62828" stroke-width="1.5" stroke-dasharray="4 3"/>
    <rect x="566" y="168" width="106" height="7" rx="3.5" fill="#D62828" opacity="0.45"/>
    <rect x="566" y="181" width="82" height="7" rx="3.5" fill="#D62828" opacity="0.45"/>
    <text x="566" y="197" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="700" fill="#B91C1C">quote &#183; figures</text>

    <rect x="560" y="216" width="118" height="7" rx="3.5" fill="#D8D8D0"/>
    <rect x="560" y="230" width="98" height="7" rx="3.5" fill="#D8D8D0"/>
  </g>

  <!-- Conversion arrow -->
  <line x1="704" y1="150" x2="742" y2="150" stroke="#1A1A1A" stroke-width="3"/>
  <polygon points="742,142 755,150 742,158" fill="#1A1A1A"/>

  <!-- Result document -->
  <g>
    <rect x="768" y="42" width="146" height="216" rx="9" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.5"/>
    <text x="841" y="66" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.4" fill="#7A7A7A">BLOG POST</text>
    <line x1="782" y1="78" x2="900" y2="78" stroke="#E5E5DF" stroke-width="1.5"/>

    <rect x="782" y="90" width="110" height="11" rx="5.5" fill="#1A1A1A"/>
    <rect x="782" y="112" width="118" height="7" rx="3.5" fill="#D8D8D0"/>
    <rect x="782" y="126" width="104" height="7" rx="3.5" fill="#D8D8D0"/>
    <rect x="782" y="140" width="118" height="7" rx="3.5" fill="#D8D8D0"/>

    <rect x="778" y="158" width="126" height="40" rx="6" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/>
    <circle cx="793" cy="178" r="8" fill="#059669"/>
    <path d="M789.5 178 L792 180.5 L797 174.5" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="807" y="182" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="700" fill="#065F46">publish-ready</text>

    <rect x="782" y="212" width="118" height="7" rx="3.5" fill="#D8D8D0"/>
    <rect x="782" y="226" width="94" height="7" rx="3.5" fill="#D8D8D0"/>
  </g>
</svg>
