<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360" role="img" aria-labelledby="archTitle archDesc">
  <title id="archTitle">PressFolio architecture</title>
  <desc id="archDesc">Two paths from the browser. The Basic path stays entirely in the browser: index.astro runs the client-side parser and generator and exports Markdown, dot-md or HTML. The AI path posts extracted parameters to the api generate route, an Astro serverless function that calls the NaraRouter OpenAI-compatible endpoint using the NARA_API_KEY environment variable.</desc>

  <rect width="880" height="360" fill="#FFFFFF"/>

  <!-- Browser zone -->
  <rect x="24" y="36" width="400" height="288" rx="12" fill="#FAFAF8" stroke="#D8D8D0" stroke-width="1.5"/>
  <text x="46" y="62" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" letter-spacing="1.3" fill="#7A7A7A">BROWSER</text>

  <rect x="46" y="78" width="170" height="102" rx="9" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="2"/>
  <text x="131" y="106" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#1A1A1A">index.astro</text>
  <text x="131" y="128" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#4A4A4A">the five-stage tool</text>
  <text x="131" y="148" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#7A7A7A">parser &#183; generator</text>
  <text x="131" y="166" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#7A7A7A">preview &#183; export</text>

  <!-- Basic -->
  <rect x="46" y="210" width="170" height="94" rx="9" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
  <text x="131" y="238" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#065F46">Basic mode</text>
  <text x="131" y="260" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#065F46">no network call</text>
  <text x="131" y="280" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#065F46">nothing uploaded</text>

  <line x1="131" y1="180" x2="131" y2="210" stroke="#059669" stroke-width="2.5"/>
  <polygon points="124,204 131,216 138,204" fill="#059669"/>

  <!-- AI within browser -->
  <rect x="238" y="210" width="170" height="94" rx="9" fill="#FEE2E2" stroke="#D62828" stroke-width="2"/>
  <text x="323" y="238" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#B91C1C">AI mode</text>
  <text x="323" y="260" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#B91C1C">POSTs the</text>
  <text x="323" y="280" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#B91C1C">extracted fields</text>

  <path d="M216 156 L323 156 L323 210" fill="none" stroke="#D62828" stroke-width="2.5"/>
  <polygon points="316,204 323,216 330,204" fill="#D62828"/>

  <!-- Server zone -->
  <rect x="456" y="36" width="400" height="148" rx="12" fill="#F5F5F0" stroke="#D8D8D0" stroke-width="1.5"/>
  <text x="478" y="62" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" letter-spacing="1.3" fill="#7A7A7A">SERVER (VERCEL)</text>
  <text x="834" y="62" text-anchor="end" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#B91C1C">AI mode only</text>

  <rect x="478" y="78" width="356" height="88" rx="9" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="2"/>
  <text x="656" y="106" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5" font-weight="700" fill="#1A1A1A">/api/generate</text>
  <text x="656" y="128" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#4A4A4A">Astro serverless route</text>
  <text x="656" y="148" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#4A4A4A">validates &#183; builds the prompt</text>

  <!-- Browser to server through the gutter -->
  <path d="M408 257 L432 257 L432 122 L478 122" fill="none" stroke="#D62828" stroke-width="2.5" stroke-dasharray="6 4"/>
  <polygon points="472,115 484,122 472,129" fill="#D62828"/>

  <!-- External -->
  <rect x="456" y="212" width="400" height="112" rx="12" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="2"/>
  <text x="478" y="238" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" letter-spacing="1.3" fill="#7A7A7A">EXTERNAL</text>
  <text x="656" y="266" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#1A1A1A">NaraRouter</text>
  <text x="656" y="288" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#4A4A4A">router.bynara.id/v1/chat/completions</text>
  <text x="656" y="308" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#4A4A4A">OpenAI-compatible &#183; NARA_API_KEY</text>

  <line x1="656" y1="166" x2="656" y2="212" stroke="#1A1A1A" stroke-width="2.5"/>
  <polygon points="649,206 656,218 663,206" fill="#1A1A1A"/>

  <text x="440" y="348" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#7A7A7A">AI Enhancement is off by default. Without it, PressFolio makes no network request with your content.</text>
</svg>
